# Test glu-scan, en bouw bij een release de kant-en-klare programma's voor
# Mac en Windows. Een programma kan alleen gebouwd worden op het systeem waar
# het voor bedoeld is, dus daar draaien drie machines voor.
#
# Een nieuwe release maken:
#   git tag glu-scan-v1.0.0 && git push origin glu-scan-v1.0.0
# GitHub bouwt dan de bestanden en hangt ze onder "Releases".

name: glu-scan

on:
  push:
    branches: [main]
    tags: ['glu-scan-v*']
    paths: ['glu-scan/**', '.github/workflows/glu-scan.yml']
  pull_request:
    paths: ['glu-scan/**', '.github/workflows/glu-scan.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: glu-scan

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  bouwen:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - besturingssysteem: macos-14      # Apple Silicon
            naam: macos-arm64
          - besturingssysteem: macos-13      # Intel-Macs
            naam: macos-x64
          - besturingssysteem: windows-latest
            naam: windows-x64
          - besturingssysteem: ubuntu-latest
            naam: linux-x64
    runs-on: ${{ matrix.besturingssysteem }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

      # Het programma, het startbestand en een leesmij samen in één zip.
      # Zippen bewaart op Mac het uitvoerrecht; een los gedownload bestand
      # verliest dat en start dan niet.
      - name: Inpakken (Mac en Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p pakket
          cp dist/glu-scan-${{ matrix.naam }} pakket/glu-scan
          chmod +x pakket/glu-scan
          cp build/starters/LEESMIJ.txt pakket/
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp "build/starters/Start GLU Scan.command" pakket/
            chmod +x "pakket/Start GLU Scan.command"
          fi
          cd pakket && zip -r -q "../glu-scan-${{ matrix.naam }}.zip" .

      - name: Inpakken (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path pakket | Out-Null
          Copy-Item dist/glu-scan-${{ matrix.naam }}.exe pakket/glu-scan.exe
          Copy-Item build/starters/LEESMIJ.txt pakket/
          Copy-Item "build/starters/Start GLU Scan.bat" pakket/
          Compress-Archive -Path pakket/* -DestinationPath "glu-scan-${{ matrix.naam }}.zip" -Force
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: glu-scan-${{ matrix.naam }}
          path: glu-scan/glu-scan-${{ matrix.naam }}.zip
          if-no-files-found: error

  uitgeven:
    needs: bouwen
    if: startsWith(github.ref, 'refs/tags/glu-scan-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: pakketten
          merge-multiple: true
      - name: Release maken
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          cat > notities.md <<'EOF'
          Privacyscan vóór upload naar de GLU Analysetool.

          Download het bestand voor jouw computer, pak het uit en dubbelklik het startbestand. Node.js hoeft niet geïnstalleerd te zijn; dat zit erin.

          | Bestand | Voor |
          |---|---|
          | `glu-scan-macos-arm64.zip` | Mac met Apple-chip (M1 en nieuwer) |
          | `glu-scan-macos-x64.zip` | Mac met Intel-processor |
          | `glu-scan-windows-x64.zip` | Windows |
          | `glu-scan-linux-x64.zip` | Linux |

          De eerste keer waarschuwt Mac of Windows dat de maker onbekend is: het programma is niet ondertekend bij Apple of Microsoft. In LEESMIJ.txt staat hoe je dat eenmalig toestaat.

          Alles draait lokaal: er gaat geen bestand naar internet. Wil je ook namen en adressen in lopende tekst laten herkennen, zet dan LM Studio ernaast — de scan vindt hem vanzelf.
          EOF
          gh release create "${{ github.ref_name }}" \
            --title "glu-scan ${{ github.ref_name }}" \
            --notes-file notities.md \
            pakketten/*.zip
